[workspace]
resolver = "2"
members = [
  "engine/reportcore",
  "engine/report-cli",
  "engine/reportcore-ffi",
  "desktop/src-tauri",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
authors = ["LabVIEW Report Builder contributors"]
repository = "https://github.com/zeshanabdullah10/ReportBuilder"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Keep dev builds small and fast: line tables for our crates, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
