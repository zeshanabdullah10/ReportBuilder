[package]
name = "report-cli"
description = "Render Report Builder templates to PDF from the command line or a local HTTP API"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "report-cli"
path = "src/main.rs"

[dependencies]
reportcore = { path = "../reportcore" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
