name: Feature request
description: Suggest a new block, expression function or integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The report or workflow you need, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A sketch, an existing report, or sample data showing the result you want.
