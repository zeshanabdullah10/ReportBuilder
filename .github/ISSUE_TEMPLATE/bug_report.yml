name: Bug report
description: Something renders wrong, crashes or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop editor
        - report-cli
        - LabVIEW / C library (reportbuilder.dll)
        - Python or C# bindings
        - Rendered PDF output
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From the installer or zip file name, or `report-cli --version`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 x64, LabVIEW 2023 32-bit"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Template and data to reproduce
      description: Attach the .rbt.json template and a small JSON data file (replace any private values).
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: CLI output, the JSON result from rb_render, or a screenshot.
      render: text
