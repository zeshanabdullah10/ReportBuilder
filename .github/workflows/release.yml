name: Release

# Push a v* tag to publish a release:
#   1. `create` opens a draft release for the tag (or reuses the tag's existing draft),
#   2. every build job uploads its installer or package into that draft by release id,
#   3. `publish` makes the release public once all builds have succeeded.
# To (re)build the release for an existing tag, run this workflow manually with that tag.
# Pull requests that change the packaging run the same builds as a dry run and
# upload the results as workflow artifacts instead.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.0.0)
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/Cargo.toml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
  # The tag being released (empty for pull-request dry runs).
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  create:
    name: Create draft release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          case "$TAG" in v*) ;; *) echo "::error::Tag must start with v, got '$TAG'"; exit 1 ;; esac
          gh api "repos/$repo/git/ref/tags/$TAG" --silent || { echo "::error::Tag $TAG does not exist"; exit 1; }

          # Reuse this tag's release if one exists (e.g. from an earlier, failed run).
          existing=$(gh api "repos/$repo/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0] | select(. != null) | \"\(.id) \(.draft)\"")
          if [ -n "$existing" ]; then
            read -r id draft <<< "$existing"
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published; bump the version for a new release."
              exit 1
            fi
            echo "Reusing draft release $id"
          else
            notes="Downloads:
          - **Desktop editor**: Windows \`-setup.exe\` or \`.msi\`, macOS \`.dmg\` (Apple silicon and Intel), Linux \`.AppImage\`, \`.deb\` or \`.rpm\`
          - **Test stations** (\`report-cli\` plus the \`reportbuilder\` library for LabVIEW, Python and C#): \`reportbuilder-<platform>.zip\`. Use \`windows-x86\` for 32-bit LabVIEW.

          The installers are not code-signed yet. Windows: if SmartScreen warns, choose *More info → Run anyway*. macOS: open the app once, then click *Open Anyway* in *System Settings → Privacy & Security*. See the [README](https://github.com/$repo#download) for details."
            id=$(gh api -X POST "repos/$repo/releases" -f tag_name="$TAG" -f name="Report Builder $TAG" \
              -f body="$notes" -F draft=true --jq .id)
            echo "Created draft release $id"
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: create
    if: ${{ !cancelled() && (needs.create.result == 'success' || needs.create.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, args: '' }
          - { name: macos, os: macos-latest, args: '--target universal-apple-darwin' }
          - { name: linux, os: ubuntu-22.04, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed by runner image: CI jobs of the same name build on a newer Ubuntu, and
          # their build scripts need a newer glibc than the ubuntu-22.04 release runners have.
          key: release-${{ matrix.os }}-${{ matrix.name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          # Empty on dry runs: build only, no upload.
          releaseId: ${{ needs.create.outputs.release_id }}
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        if: env.IS_RELEASE != 'true'
        with:
          name: desktop-${{ matrix.name }}
          path: |
            target/release/bundle/
            target/*/release/bundle/
          if-no-files-found: error

  engine:
    name: CLI + LabVIEW library (${{ matrix.target }})
    needs: create
    if: ${{ !cancelled() && (needs.create.result == 'success' || needs.create.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, name: windows-x64 }
          - { target: i686-pc-windows-msvc, os: windows-latest, name: windows-x86 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, name: linux-x64 }
          - { target: aarch64-apple-darwin, os: macos-latest, name: macos-arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, name: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Keyed by runner image: CI jobs of the same name build on a newer Ubuntu, and
          # their build scripts need a newer glibc than the ubuntu-22.04 release runners have.
          key: release-${{ matrix.os }}-${{ matrix.target }}
      - name: Build
        # Link the C runtime statically on Windows so report-cli.exe and reportbuilder.dll run on
        # test stations without the Visual C++ Redistributable.
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'windows-msvc') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release -p report-cli -p reportcore-ffi --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="reportbuilder-${{ matrix.name }}"
          mkdir -p "$out/include" "$out/bindings" "$out/templates"
          dir="target/${{ matrix.target }}/release"
          for f in report-cli report-cli.exe reportbuilder.dll reportbuilder.dll.lib libreportbuilder.so libreportbuilder.dylib; do
            if [ -f "$dir/$f" ]; then cp "$dir/$f" "$out/"; fi
          done
          cp engine/reportcore-ffi/include/reportbuilder.h "$out/include/"
          cp integrations/python/reportbuilder.py integrations/csharp/ReportBuilder.cs "$out/bindings/"
          cp integrations/labview/README.md "$out/LABVIEW.md"
          cp docs/cli.md "$out/CLI.md"
          cp engine/reportcore/templates/*.json "$out/templates/"
          cp LICENSE THIRD-PARTY-NOTICES.md "$out/"
          mkdir -p "$out/licenses"
          cp engine/reportcore/fonts/*-LICENSE.txt "$out/licenses/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$out.zip" "$out" >/dev/null; else zip -qr "$out.zip" "$out"; fi
      - name: Smoke test the packaged CLI
        # x86_64-apple-darwin is cross-compiled on an Apple-silicon runner and can't run there.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          pkg="reportbuilder-${{ matrix.name }}"
          cli="$pkg/report-cli"; [ -f "$cli.exe" ] && cli="$cli.exe"
          "$cli" --version
          "$cli" render --strict -t "$pkg/templates/ate-final-test.rbt.json" -d "$pkg/templates/ate-final-test.data.json" -o smoke.pdf
          head -c 5 smoke.pdf | grep -q '%PDF-'
      - name: Upload to release
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create.outputs.release_id }}
        run: |
          set -euo pipefail
          f="reportbuilder-${{ matrix.name }}.zip"
          # Replace the asset if an earlier run already uploaded it.
          for old in $(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$f\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          done
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/zip" \
            --data-binary "@$f" "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$f" > /dev/null
          echo "Uploaded $f"
      - uses: actions/upload-artifact@v7
        if: env.IS_RELEASE != 'true'
        with:
          name: reportbuilder-${{ matrix.name }}
          path: reportbuilder-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [create, desktop, engine]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create.outputs.release_id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true --jq .html_url
